apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.hostname }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: wishlist-app-tls

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wishlist
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: gateway
      namespace: {{ .Release.Namespace }}
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - backendRefs:
      - name: wishlist-app
        port: 8080