apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishlist-app
  namespace: wishlist-{{ .Values.environment }}
  labels:
    app: wishlist-app
spec:
  selector:
    matchLabels:
      app: wishlist-app
  template:
    metadata:
      labels:
        app: wishlist-app
    spec:
      containers:
      - name: wishlist-app
        image: "{{ .Values.app.image }}:{{ .Values.app.tag }}"
        imagePullPolicy: IfNotPresent
        env:
        - name: ConnectionStrings__SqlServer
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: connection-string
        - name: ApplicationUrl
          value: https://{{ .Values.hostname }}
      imagePullSecrets:
      - name: harbor
