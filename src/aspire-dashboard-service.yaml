apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: aspire-dashboard
  ports:
  - name: web
    port: 18888
    protocol: TCP
    targetPort: 18888
  - name: otlp
    port: 4317
    protocol: TCP
    targetPort: 18889