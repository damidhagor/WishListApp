name: Publish To Docker Registry

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'The semantic version of the application'
        required: true

jobs:
  build-wishlist-app:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: src/global.json

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish and push Docker image
      run: |
        dotnet publish src/WishListApp \
          -t PublishContainer \
          -p ContainerFamily=noble-chiseled-extra \
          -p ContainerRegistry=ghcr.io \
          -p ContainerRepository=${{ github.actor }}/wishlist-app \
          -p ContainerImageTag=${{ inputs.version }}
        
  publish-helm-chart:
    runs-on: ubuntu-latest
    needs: [build-wishlist-app]
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Replace Version in values.yaml
      run: "sed -i \"s/tag: \"latest\"/tag: \"${{ inputs.version }}\"/g\" helm/wishlist/values.yaml"

    - name: Helm Setup
      uses: azure/setup-helm@v4

    - name: Helm Login
      run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

    - name: Helm Package
      run: helm package helm/wishlist --app-version "${{ inputs.version }}"

    - name: Helm Push
      run: helm push wishlist-*.tgz oci://ghcr.io/${{ github.actor }}
