name: Publish To Docker Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The semantic version of the application'
        required: true

jobs:
  build-wishlist-app:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: src/global.json

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish and push Docker image
      run: |
        dotnet publish src/WishListApp \
          -t PublishContainer \
          -p ContainerFamily=noble-chiseled-extra \
          -p ContainerRegistry=ghcr.io \
          -p ContainerRepository=${{ github.actor }}/wishlist-app \
          -p ContainerImageTag=${{ inputs.version }}
