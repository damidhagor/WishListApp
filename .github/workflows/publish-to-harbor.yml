name: Publish To Harbor

on:
  push:
    branches:
      - main
      - helm-chart
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'The semantic version of the application'
        required: true
        default: '1.0.0'

jobs:
  build-wishlist-app:
    runs-on: ubuntu-latest

    steps:
    - name: Create Version Number
      id: version
      run: |
        if [ "${{ inputs.version }}" != '' ]; then
          echo "::set-output name=version::${{ inputs.version }}"
        else
          echo "::set-output name=version::${{ github.run_id }}"
        fi
        echo "Version: ${{ steps.version.outputs.version }}"
    - name: Checkout Repository
      uses: actions/checkout@v3
    - name: Harbor Login
      uses: docker/login-action@v3.0.0
      with:
        registry: harbor.damidhagor.de
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_ACCESS_TOKEN }}
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5.0.0
      with:
        context: "{{defaultContext}}:src"
        file: WishlistApp/Dockerfile
        tags: harbor.damidhagor.de/wishlist/wishlist-app:${{ steps.version.outputs.version }}, harbor.damidhagor.de/wishlist/wishlist-app:latest
        push: true
        
  build-wishlist-cli:
    runs-on: ubuntu-latest

    steps:
    - name: Create Version Number
      id: version
      run: |
        if [ "${{ inputs.version }}" != '' ]; then
          echo "::set-output name=version::${{ inputs.version }}"
        else
          echo "::set-output name=version::${{ github.run_id }}"
        fi
        echo "Version: ${{ steps.version.outputs.version }}"
    - name: Checkout Repository
      uses: actions/checkout@v3
    - name: Docker Login
      uses: docker/login-action@v3.0.0
      with:
        registry: harbor.damidhagor.de
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_ACCESS_TOKEN }}
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5.0.0
      with:
        context: "{{defaultContext}}:src"
        file: WishlistApp.Cli/Dockerfile
        tags: harbor.damidhagor.de/wishlist/wishlist-cli:${{ steps.version.outputs.version }}, harbor.damidhagor.de/wishlist/wishlist-cli:latest
        push: true
        
