name: Publish To Harbor

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The semantic version of the application'
        required: true

jobs:
  build-wishlist-app:
    runs-on: ubuntu-latest
    
    permissions:
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Harbor Login
      uses: docker/login-action@v3.0.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5.0.0
      with:
        context: "{{defaultContext}}"
        file: src/WishListApp/Dockerfile
        platforms: linux/amd64,linux/arm64
        tags: ghcr.io/wishlist/wishlist-app:${{ inputs.version }}
        push: true
        
  publish-helm-chart:
    runs-on: ubuntu-latest
    needs: [build-wishlist-app]
    
    permissions:
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Replace Version in values.yaml
      run: "sed -i \"s/tag: \"latest\"/tag: \"${{ inputs.version }}\"/g\" helm/wishlist/values.yaml"

    - name: Helm Setup
      uses: azure/setup-helm@v4

    - name: Helm Login
      run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

    - name: Helm Package
      run: helm package helm/wishlist --app-version "${{ inputs.version }}"

    - name: Helm Push
      run: helm push wishlist-*.tgz oci://ghcr.io/wishlist
