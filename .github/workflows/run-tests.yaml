name: Run Tests

on: [push]

jobs:
  build-wishlist-app:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.x.x
        cache: true
    - name: Build
      run: dotnet build src/
    - name: Test
      run: dotnet test src/
      