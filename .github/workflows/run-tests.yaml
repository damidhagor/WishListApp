name: Run Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: src/global.json
        
    - name: Test
      run: dotnet test src/
      
